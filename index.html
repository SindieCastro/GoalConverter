
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Goal Converter</title>

  <!-- ✅ Correct CSS link -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>🎯 Sindie Academy's Goal Converter</h1>


<div class="card">
  <h2>Enter Your Goal</h2>
  <textarea id="goalInput" placeholder="e.g. I want to earn $980,000 in one year"></textarea>
<label for="timeframe">Select Timeframe:</label>
<select id="timeframe">
  <option value="30">30 days</option>
  <option value="60">60 days</option>
  <option value="90">90 days</option>
</select>

  <button onclick="convertGoal()">Convert Goal</button>
</div>


  <div class="card">
    <h2>Result</h2>
    <p id="result">Your result will appear here</p>
  </div>

  <div class="card">
    <h2>Saved Goals</h2>
     <button onclick="clearGoals()">Clear All Goals</button>
    <ul id="savedGoals"></ul>
  </div>
</div>

<!-- ✅ Correct JS link -->
<script src="script.js"></script>


</body>
</html>
