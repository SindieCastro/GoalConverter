
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Goal Converter</title>

  <!-- ✅ Correct CSS link -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>🎯 Goal Converter</h1>


<div class="card">
  <h2>Enter Your Goal</h2>

  <textarea id="goalInput" placeholder="e.g. I want to earn $980,000 in one year"></textarea>

  <button onclick="convertGoal()">Convert Goal</button>
</div>


  <div class="card">
    <h2>Result</h2>
    <p id="result">Your result will appear here</p>
  </div>

  <div class="card">
    <h2>Saved Goals</h2>
    <ul id="savedGoals"></ul>
  </div>
</div>

<!-- ✅ Correct JS link -->
<script src="script.js"></script>

</body>
</html>
